version: 2
registries:
    github-packages:
        type: npm-registry
        url: https://npm.pkg.github.com
        token: ${{ secrets.DEPENDABOT_READER_TOKEN }}

updates:
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: daily
      cooldown:
          default-days: 3

    - package-ecosystem: npm
      directory: /
      registries:
          - github-packages
      schedule:
          interval: daily
      cooldown:
          default-days: 3
      groups:
          nav-packages:
              patterns:
                  - '@navikt/*'
          development-dependencies:
              dependency-type: development
          patch-updates:
              update-types:
                  - semver-patch

    - package-ecosystem: npm
      directory: /server
      schedule:
          interval: daily
      cooldown:
          default-days: 3
      groups:
          development-dependencies:
              dependency-type: development
          patch-updates:
              update-types:
                  - semver-patch
